<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실제 화면 · ST-ROOKIE 시안</title>
  <!-- 허브 시안(hub-concepts.html)의 '실제 화면' 창. 주소 뒤 #기능 id(steps·todo·report·incident·whatif·synapse·notes·patterns·card·exam)를 보고
       실제 학습 기록(Trainee Dashboard.dc.html) 또는 평가 시험(/exam)을 안쪽에 띄워 그 탭을 눌러 둔다.
       기존 화면 파일은 고치지 않는다: 같은 서버(같은 출처)라 안쪽 문서에 '이 창 전용' 스타일만 넣고 버튼을 대신 누른다. -->
  <style>
    html, body { margin: 0; height: 100%; background: #f4f0ed; font: 15px/1.5 "Pretendard", "Malgun Gothic", sans-serif; color: #1d1714; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f0ed; }
    iframe[hidden] { display: none; }
    .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
    .msg[hidden] { display: none; }
    form { display: grid; gap: 10px; width: min(320px, 90vw); text-align: left; }
    form h2 { margin: 0 0 4px; font-size: 20px; }
    form p { margin: 0 0 6px; color: #574a44; font-size: 14px; }
    input { height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(60,40,30,.2); font: inherit; }
    button { height: 44px; border-radius: 999px; border: 0; background: #ff9e64; color: #1a0b03; font: 700 15px inherit; cursor: pointer; }
    .err { color: #c53030; font-size: 14px; min-height: 1.4em; }
    .loading { color: #776a64; font-size: 14px; }
  </style>
</head>
<body>
  <iframe id="dash" title="학습 기록" hidden></iframe>
  <iframe id="exam" title="평가 시험" hidden></iframe>
  <div class="msg" id="login" hidden>
    <form id="form"><h2>로그인이 필요해요</h2><p>실제 화면은 내 학습 기록을 불러와요. 학습 기록과 같은 아이디로 로그인하세요.</p>
      <input id="id" autocomplete="username" placeholder="아이디" required><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button type="submit">로그인</button><span class="err" id="err"></span></form>
  </div>
  <div class="msg loading" id="wait">실제 화면을 여는 중…</div>
  <script>
    const TOKEN = 'st-rookie-token';
    const token = () => { try { return localStorage.getItem(TOKEN) || sessionStorage.getItem(TOKEN) || ''; } catch (e) { return ''; } };
    // [새 창으로]로 열렸는데 이 탭에 로그인 정보가 없으면(로그인 상태 유지를 끄면 탭 전용 sessionStorage에만 있다) 연 창(같은 사이트)의 것을 이 탭에 옮겨 둔다
    (() => { if (token()) return; try { const t = window.opener && window.opener.location.origin === location.origin && window.opener.sessionStorage.getItem(TOKEN); if (t) sessionStorage.setItem(TOKEN, t); } catch (e) {} })();
    // 기능 → 실제 화면에서 누를 탭(모듈 탭 · 학습 랩 하위 탭). only: 학습 랩 안에서 그 부분만 남긴다
    const ROUTES = {
      // todo: 하위 탭을 한 번 눌러야 실습 경로를 불러온다
      steps: { tab: '작동 단계' }, todo: { tab: '학습 랩', sub: '간격 반복', only: 'path' },
      report: { tab: '학습 랩', sub: '보고서' }, incident: { tab: '학습 랩', sub: '사고 사례' },
      whatif: { tab: '학습 랩', sub: 'What-if' }, synapse: { tab: '학습 랩', sub: 'What-if 시냅스' }, notes: { tab: '학습 랩', sub: '설비 메모' },
      patterns: { tab: '학습 랩', sub: '내 오답 유형' }, card: { tab: '사원증' }, exam: { page: 'exam' },
    };
    // 이 창 안에서만 쓰는 스타일: 헤더·튜터 열·탭 줄을 숨겨 그 기능만 크게 보인다
    const DASH_CSS = `
      .dashboard-header, .side, .dg-ftabs, section[data-sec="lab"] > .dg-section-head, section[data-sec="lab"] [role="tablist"] { display: none !important; }
      .learn { grid-template-columns: 1fr !important; }
      .dg-pop { animation: none !important; }
      .dg-main { width: calc(100% - 24px) !important; padding: 12px 0 24px !important; }
      html:not(.hub-todo) .lb-path { display: none !important; }
      html.hub-todo section[data-sec="lab"] > :not(.lb-path):not(:has(.lb-path)) { display: none !important; }`;
    const EXAM_CSS = `.topbar { display: none !important; } main { padding-top: 16px !important; }`;
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    function inject(frame, css) {
      const d = frame.contentDocument; if (!d || d.getElementById('hub-embed')) return;
      const s = d.createElement('style'); s.id = 'hub-embed'; s.textContent = css; (d.head || d.documentElement).append(s);
    }
    // 실제 화면이 그려질 때까지 기다렸다가 글자로 버튼을 찾아 누른다. 막 열린 화면은 버튼이 보여도 아직 눌리지 않을 때가 있어서
    // 누른 뒤 그 탭이 골라졌는지(그리고 done()이 참인지) 확인하고, 아니면 다시 누른다. 이미 골라진 탭도 누른다: 그래야 그 탭의 자료를 불러온다
    async function press(doc, scope, label, done = () => true, my) {
      const find = () => [...doc.querySelectorAll(`${scope} button`)].find((x) => (x.firstChild?.textContent || x.textContent).trim() === label);
      for (let i = 0; i < 40 && my === seq; i++) {
        const b = find();
        if (b) { b.click(); await sleep(300); if (find()?.getAttribute('aria-selected') === 'true' && done()) return true; }
        else await sleep(150);
      }
      return false;
    }
    let ready = { dash: null, exam: null }, seq = 0;
    function load(which) {
      if (ready[which]) return ready[which];
      const f = $(which);
      ready[which] = new Promise((res) => { f.addEventListener('load', () => { inject(f, which === 'exam' ? EXAM_CSS : DASH_CSS); res(f); }, { once: true }); });
      f.src = which === 'exam' ? '/exam' : '/login_ui/Trainee%20Dashboard.dc.html';
      return ready[which];
    }
    async function show(id) {
      const r = ROUTES[id] || ROUTES.steps, my = ++seq;
      if (!token()) { $('wait').hidden = true; $('login').hidden = false; $('dash').hidden = true; $('exam').hidden = true; return; }
      $('login').hidden = true;
      const which = r.page === 'exam' ? 'exam' : 'dash', f = await load(which);
      if (my !== seq) return;
      $('dash').hidden = which !== 'dash'; $('exam').hidden = which !== 'exam'; $('wait').hidden = true;
      if (which === 'exam') { f.contentWindow.scrollTo(0, 0); return; }
      const d = f.contentDocument; d.documentElement.classList.toggle('hub-todo', r.only === 'path');
      await press(d, '.dg-ftabs', r.tab, undefined, my);
      if (r.sub) await press(d, 'section[data-sec="lab"] [role="tablist"]', r.sub, r.only === 'path' ? () => !!d.querySelector('.lb-path') : undefined, my);
      if (my === seq) f.contentWindow.scrollTo(0, 0);
    }
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault(); $('err').textContent = '';
      try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('id').value.trim(), password: $('pw').value }) });
        const j = await res.json().catch(() => ({}));
        if (!res.ok || !j.token) throw new Error(j.error || '로그인하지 못했어요');
        sessionStorage.setItem(TOKEN, j.token); ready = { dash: null, exam: null }; show(location.hash.slice(1));
      } catch (err) { $('err').textContent = err.message; }
    });
    // 새 탭에 로그인 정보가 없으면(로그인 상태 유지를 끄면 탭 전용 sessionStorage에만 있다) 열려 있는 학습 기록 탭(learn.js)에 물어 이 탭에 옮겨 둔다.
    // BroadcastChannel은 같은 사이트의 탭끼리만 통한다. 1.2초 안에 답이 없으면 로그인 창을 보인다
    function adopt() {
      if (token() || !('BroadcastChannel' in window)) return Promise.resolve();
      return new Promise((done) => {
        const bc = new BroadcastChannel('st-rookie-auth'), end = () => { clearTimeout(to); bc.close(); done(); };
        const to = setTimeout(end, 1200);
        bc.onmessage = (e) => { if (e.data && e.data.type === 'token' && e.data.token) { try { sessionStorage.setItem(TOKEN, e.data.token); } catch (err) {} end(); } };
        bc.postMessage({ type: 'need-token' });
      });
    }
    addEventListener('hashchange', () => show(location.hash.slice(1)));
    adopt().then(() => show(location.hash.slice(1)));
  </script>
</body>
</html>
